# nim_usockets configuration
# Cross-platform linking for uSockets

--path:"../vendor/nim_libdeflate_gzip/src"

# Platform-specific linking
@if macosx:
  # macOS uses GCD (Grand Central Dispatch) which requires CoreFoundation
  --define:LIBUS_USE_GCD
  --passL:"-framework CoreFoundation"
@end

@if linux:
  --passC:"-D_GNU_SOURCE -ftls-model=local-exec"
  @if useIoUring:
    --passC:"-DLIBUS_USE_IO_URING"
    --passL:"-luring"
    --passL:"-lpthread"
    --passL:"-ldl"
  @else:
    @if LIBUS_USE_IO_URING:
      --passC:"-DLIBUS_USE_IO_URING"
      --passL:"-luring"
    @end
    --passL:"-lpthread"
    --passL:"-ldl"
  @end
@end

@if windows:
  # Windows linking
  --passL:"-lws2_32"
@end

# For SSL support (if built with WITH_OPENSSL=1):
# --passL:"-lssl -lcrypto"
