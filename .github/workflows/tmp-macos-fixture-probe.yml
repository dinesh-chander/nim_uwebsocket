name: tmp-macos-fixture-probe

on:
  push:
    branches: [ci/ci-checks]
    paths:
      - ".github/workflows/tmp-macos-fixture-probe.yml"
      - "probe-trigger.txt"

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2.3.0
        with:
          nim-version: "2.2.8"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build vendored uSockets
        run: make usockets
      - name: Probe fixture compile
        run: |
          set +o pipefail
          nim c -d:release \
            --path:nim_utils/src --path:nim_usockets/src \
            --path:vendor/zippy/src --path:vendor/checksums \
            --passL:"nim_usockets/usockets/uSockets.a -framework CoreFoundation" \
            -o:nim_express/tests/ws_permessage_deflate_integration_server \
            nim_express/tests/ws_permessage_deflate_integration_server.nim > probe.log 2>&1
          echo "nim exit=$?"
          tail -40 probe.log
