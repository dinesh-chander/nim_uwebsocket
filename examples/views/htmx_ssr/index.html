<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: Georgia, "Times New Roman", serif; background: #f8f6f2; color: #1f2937; max-width: 820px; margin: 0 auto; padding: 24px; }
    .bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .bar input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .bar button { padding: 8px 12px; border: 0; border-radius: 8px; background: #1f2937; color: white; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px; }
    .meta { color: #6b7280; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>
  <p>{{subtitle}}</p>

  <form class="bar" hx-post="/cards" hx-target="#card-list" hx-swap="afterbegin">
    <input type="text" name="text" placeholder="Add server-rendered card" required>
    <button type="submit">Create</button>
  </form>

  <div id="clock" hx-get="/fragments/clock" hx-trigger="load, every 3s" hx-swap="innerHTML">
    <em>Loading server clock...</em>
  </div>

  <div id="card-list">
    {{{cards_html}}}
  </div>
</body>
</html>
