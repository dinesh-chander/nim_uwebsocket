<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 8px; }
    button { padding: 8px 10px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #e5e7eb; border-radius: 10px; margin-bottom: 10px; padding: 10px; }
    .done { text-decoration: line-through; color: #666; }
    .meta { color: #666; margin-bottom: 12px; }
    .upload { display: flex; gap: 8px; margin-top: 8px; }
    .attachments { margin: 8px 0 0; font-size: 14px; color: #444; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>
  <p class="meta">{{subtitle}}</p>

  <form class="row" hx-post="/todos" hx-target="#todo-list" hx-swap="beforeend">
    <input type="text" name="title" placeholder="Add a todo item" required>
    <button type="submit">Add</button>
  </form>

  <ul id="todo-list">
    {{{todos_html}}}
  </ul>
</body>
</html>
