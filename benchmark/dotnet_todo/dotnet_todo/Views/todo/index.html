<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 780px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 16px; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #e6e6e6; }
    label.done span { text-decoration: line-through; color: #666; }
    .meta { color: #666; margin: 8px 0 16px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>{{title}}</h1>

  <form hx-post="/todos" hx-target="#todo-list" hx-swap="outerHTML" hx-on::after-request="if(event.detail.successful){ this.reset(); htmx.ajax('GET', '/todos/count', '#todo-count'); }">
    <input type="text" name="title" placeholder="Add a todo" required>
    <button type="submit">Add</button>
  </form>

  <div class="meta" hx-get="/todos/count" hx-trigger="load" hx-target="#todo-count" hx-swap="outerHTML">
    <span id="todo-count">0 remaining</span>
  </div>

  <div hx-get="/todos/fragment" hx-trigger="load" hx-target="this" hx-swap="innerHTML">
    <ul id="todo-list"><li><em>Loading...</em></li></ul>
  </div>
</body>
</html>
