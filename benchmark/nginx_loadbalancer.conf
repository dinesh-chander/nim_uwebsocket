# nginx configuration for load balancing nim_express on macOS
# To achieve 150k+ req/s, run multiple nim_express instances on different ports
# and use nginx to distribute load

# Run nginx with: nginx -c /path/to/nginx_loadbalancer.conf

worker_processes auto;
error_log /tmp/nginx_error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use kqueue;  # macOS optimized
}

http {
    access_log off;  # Disable for benchmarking

    # Upstream backend servers (nim_express instances)
    upstream nim_express {
        least_conn;  # Load balance by least connections

        server 127.0.0.1:3010;
        server 127.0.0.1:3011;
        server 127.0.0.1:3012;
        server 127.0.0.1:3013;

        keepalive 256;  # Keep connections alive to backends
    }

    server {
        listen 3002;

        location / {
            proxy_pass http://nim_express;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
