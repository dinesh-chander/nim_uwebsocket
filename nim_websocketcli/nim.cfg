--mm:arc
--opt:speed
--path:"../nim_utils/src"
--path:"../nim_usockets/src"
--path:"../nim_fasthttpclient/src"
--path:"../vendor/zippy/src"
--path:"../vendor/brotli/src"
--path:"../vendor/nim_zstd"
--path:"../vendor/nim_libdeflate_gzip/src"
--path:"../vendor/malebolgia/src"
--path:"../vendor/jsony/src"
--path:"../vendor/checksums"

@if macosx:
  --passL:"../nim_usockets/usockets/uSockets.a"
  --passL:"-framework CoreFoundation"
@end

@if linux:
  --passC:"-D_GNU_SOURCE -ftls-model=local-exec"
  --passL:"../nim_usockets/usockets/uSockets.a"
  --passL:"-lpthread"
  --passL:"-ldl"
@end

@if windows:
  --passL:"../nim_usockets/usockets/uSockets.lib"
  --passL:"-lws2_32"
@end

@if nativeOpt:
  --passC:"-march=native -mtune=native"
@end
